<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Ruota della Fortuna 🎁</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff7f5;
      color: #222;
      overflow-x: hidden;
    }

    h1 {
      margin: 0 20px 35px;
      text-align: center;
      font-size: 32px;
    }

    .wheel-container {
      position: relative;
      width: 350px;
      height: 350px;
    }

    #wheel {
      width: 350px;
      height: 350px;
      border-radius: 50%;
      border: 14px solid #D60000;
      box-shadow:
        0 7px 18px rgba(0,0,0,.25),
        inset 0 0 0 3px rgba(255,255,255,.35);
      transition: transform 5s cubic-bezier(.12,.70,.15,1);
    }

    .pointer {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 43px solid white;
      filter:
        drop-shadow(0px 2px 1px #D60000)
        drop-shadow(0px 3px 3px rgba(0,0,0,.35));
    }

    button {
      margin-top: 45px;
      padding: 16px 42px;
      border: 0;
      border-radius: 100px;
      background: #D60000;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,.2);
      transition: transform .15s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    #result {
      min-height: 50px;
      margin-top: 28px;
      font-size: 28px;
      font-weight: 900;
      color: #D60000;
      text-align: center;
      padding: 0 20px;
    }

    /* coriandoli */
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 16px;
      opacity: 0.9;
      animation: fall linear forwards;
      z-index: 9999;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>
  <h1>🎁 GIRA LA RUOTA 🎁</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spinButton" onclick="spin()">GIRA!</button>

  <div id="result"></div>

  <script>
    const prizes = [
      "104€",
      "200€",
      "Un abbraccio",
      "Pat-Pat",
      "Miao",
      "200€",
      "Cena fuori",
      "5€"
    ];

    /* nuova palette: niente magenta */
    const colors = [
      "#C9A7FF", // lilla
      "#A8E600", // verde mela
      "#FFD93D", // giallo
      "#26D9D1", // turchese
      "#B79AFF", // lilla 2
      "#C7F000", // verde mela 2
      "#FFCA28", // giallo 2
      "#57DCE2"  // turchese 2
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");

    const size = canvas.width;
    const center = size / 2;
    const radius = center;
    const sliceAngle = (Math.PI * 2) / prizes.length;

    function drawWheel() {
      ctx.clearRect(0, 0, size, size);

      prizes.forEach((prize, i) => {
        const start = -Math.PI / 2 + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.85)";
        ctx.lineWidth = 5;
        ctx.stroke();

        const middle = start + sliceAngle / 2;
        const textRadius = radius * 0.64;
        const x = center + Math.cos(middle) * textRadius;
        const y = center + Math.sin(middle) * textRadius;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = "rgba(255,255,255,.8)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#24152F";
        ctx.font = prize.length > 10 ? "bold 28px Arial" : "bold 34px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(prize, 0, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(center, center, 54, 0, Math.PI * 2);
      ctx.fillStyle = "#D60000";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(center, center, 27, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();
    }

    drawWheel();

    let rotation = 0;
    let spinning = false;
    let tickInterval = null;

    /* suono tipo tic */
    function playTick() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.value = 900;
      gain.gain.value = 0.03;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    /* suono finale vittoria */
    function playWinSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const notes = [523.25, 659.25, 783.99]; // Do Mi Sol

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.value = 0.05;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const start = audioCtx.currentTime + i * 0.12;
        const end = start + 0.18;

        osc.start(start);
        osc.stop(end);
      });
    }

    function startTicking() {
      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(playTick, 140);
    }

    function stopTicking() {
      if (tickInterval) {
        clearInterval(tickInterval);
        tickInterval = null;
      }
    }

    function launchConfetti() {
      const confettiColors = [
        "#C9A7FF",
        "#A8E600",
        "#FFD93D",
        "#26D9D1",
        "#D60000",
        "#FFFFFF"
      ];

      for (let i = 0; i < 120; i++) {
        const el = document.createElement("div");
        el.className = "confetti";

        el.style.left = Math.random() * 100 + "vw";
        el.style.backgroundColor =
          confettiColors[Math.floor(Math.random() * confettiColors.length)];

        el.style.animationDuration = (2 + Math.random() * 2) + "s";
        el.style.transform = `rotate(${Math.random() * 360}deg)`;
        el.style.width = (8 + Math.random() * 6) + "px";
        el.style.height = (12 + Math.random() * 8) + "px";

        document.body.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, 4500);
      }
    }

    function spin() {
      if (spinning) return;
      spinning = true;

      const button = document.getElementById("spinButton");
      const result = document.getElementById("result");

      button.disabled = true;
      result.innerHTML = "";

      const winningSlices = [1, 5];
      const targetIndex =
        winningSlices[Math.floor(Math.random() * winningSlices.length)];

      const sliceDegrees = 45;
      const centerAngle = 22.5 + targetIndex * sliceDegrees;

      const randomOffset = Math.random() * 20 - 10;
      const targetAngle = centerAngle + randomOffset;

      const desiredRotation = (360 - targetAngle) % 360;
      const currentPosition = ((rotation % 360) + 360) % 360;
      const correction = (desiredRotation - currentPosition + 360) % 360;

      const fullSpins = 6 + Math.floor(Math.random() * 3);

      rotation += fullSpins * 360 + correction;

      startTicking();
      canvas.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => {
        stopTicking();
        playWinSound();
        launchConfetti();

        result.innerHTML = "🎉 HAI VINTO 200€! 🎉";

        button.disabled = false;
        spinning = false;
      }, 5100);
    }
  </script>
</body>
</html>
